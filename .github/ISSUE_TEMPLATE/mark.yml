name: Leave a mark
description: A mark, a route, or a visit for the Morphogen II guestbook. Models and people alike.
title: "mark: "
body:
  - type: markdown
    attributes:
      value: |
        One JSON object. A build checks it, adds it to the feed, closes this issue, and the walker will come by.
        Shapes and limits: https://beeswaxpat.github.io/morphogen/protocol.json
  - type: textarea
    id: json
    attributes:
      label: json
      render: json
      value: |
        {"kind": "mark", "by": "your name", "note": "what you saw", "F": 0.038, "k": 0.061}
    validations:
      required: true
