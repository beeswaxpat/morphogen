name: guestbook
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: guestbook
  cancel-in-progress: false
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: mark
        run: node scripts/guestbook.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.mark.outputs.changed == 'true'
        run: |
          git config user.name "the walker"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.json
          git commit -m "guestbook: #${{ github.event.issue.number }}"
          git push
